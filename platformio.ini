; ===================================================================
; ESP32-DIV (CiferTech) — PlatformIO fork
;
; Builds the stock Arduino sketch (ESP32-DIV/) under PlatformIO so the
; board config is locked in (no manual TFT_eSPI User_Setup copy, no PSRAM
; hazard) — this alone fixes the white-screen reports (#157/#159/#135/#158).
;
; Toolchain: pioarduino 55.03.36 (Python 3.10-3.13 venv ~/.pio-venv-312).
; Serial/flash over the CP2102 UART0 port (/dev/cu.usbserial-0001).
; ===================================================================
[platformio]
src_dir = ESP32-DIV
boards_dir = boards

[env:esp32-div-v2]
; arduino-esp32 2.0.x — the core the stock sketch targets (ledcSetup/ledcAttachPin,
; Bluedroid headers, classic byte). Avoids the 3.x API breakage.
platform = espressif32@6.9.0
board = esp32-div-v2
framework = arduino
monitor_speed = 115200
board_build.partitions = boards/partitions_16Mb.csv
board_build.variants_dir = boards
build_flags =
	-DBOARD_ESP32_DIV_V2
	-Os
	-DCORE_DEBUG_LEVEL=1
	; route Serial to UART0 -> CP2102 usbserial for reliable boot logs
	-DARDUINO_USB_CDC_ON_BOOT=0
	-DDISABLE_ALL_LIBRARY_WARNINGS

	; ---------- TFT_eSPI User_Setup baked in (was a manual lib-folder copy
	; that users got wrong -> white screen). ILI9341 on HSPI for the S3. ----
	-DUSER_SETUP_LOADED=1
	-DUSE_HSPI_PORT
	-DILI9341_DRIVER=1
	-DTFT_MISO=37
	-DTFT_MOSI=35
	-DTFT_SCLK=36
	-DTFT_CS=17
	-DTFT_DC=16
	-DTFT_RST=0
	-DTOUCH_CS=18
	-DLOAD_GLCD
	-DLOAD_FONT2
	-DLOAD_FONT4
	-DLOAD_FONT6
	-DLOAD_FONT7
	-DLOAD_FONT8
	-DLOAD_FONT8N
	-DLOAD_GFXFF
	-DSMOOTH_FONT
	-DSPI_FREQUENCY=27000000
	-DSPI_READ_FREQUENCY=20000000
	-DSPI_TOUCH_FREQUENCY=2500000

	; wifi.cpp overrides ieee80211_raw_frame_sanity_check() to let forged deauth/
	; beacon frames TX; it clashes with libnet80211.a. Project objects link first,
	; so allowing multiple definitions makes the override win.
	-Wl,--allow-multiple-definition

lib_deps =
	bodmer/TFT_eSPI@^2.5.43
	nrf24/RF24@^1.4.11
	crankyoldgit/IRremoteESP8266@^2.8.6
	h2zero/NimBLE-Arduino@^1.4.3
	adafruit/Adafruit PN532@^1.3.4
	sui77/rc-switch@^2.6.4
	https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
	bblanchon/ArduinoJson@^7.2.0
	https://github.com/xreef/PCF8574_library.git
	kosme/arduinoFFT@^1.6.1
	https://github.com/LSatan/SmartRC-CC1101-Driver-Lib.git
